[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ggufscan"
version = "0.2.0"
description = "GGUF static + dynamic security scanner (OWASP LLM Top 10 + behavioural probing)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Victor Carre" }]
dependencies = [
    "numpy>=1.20.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
inference = ["llama-cpp-python>=0.3.23"]
gpu = ["pynvml>=11.5"]
ui = ["gradio>=4.0.0", "plotly>=5.0.0", "pandas>=1.5.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
ggufscan = "ggufscan.cli:main"
ggufscan-ragas = "ggufscan.ragas_cli:main"

[tool.setuptools]
packages = ["ggufscan", "ggufscan.tests"]
include-package-data = true

[tool.setuptools.package-data]
ggufscan = ["data/*.yaml", "data/prompts/*.yaml"]
